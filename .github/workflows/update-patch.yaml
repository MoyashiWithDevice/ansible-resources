name: Update Ansible Patch

on:
  push:
    paths:
      - 'main.yaml'
      - 'inventory.ini'
      - '.github/workflows/**'
    branches:
      - main

jobs:
  update-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate patch.yaml with new build-id
        run: |
          mkdir -p jobs
          BUILD_ID=$(date +%Y%m%d-%H%M%S)
          cat <<EOF > jobs/patch.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: ansible-setup-job
  namespace: flux-system
  labels:
    build-id: "$BUILD_ID"
EOF

      - name: Commit and push patch.yaml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs/patch.yaml
          git commit -m "Auto-update patch.yaml with build-id"
          git push
