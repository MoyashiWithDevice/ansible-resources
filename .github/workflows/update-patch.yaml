name: Update Ansible Patch

on:
  push:
    branches: [main]
    paths:
      - main.yaml

jobs:
  update-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Generate Patch
        run: |
          TIMESTAMP=$(date +'%Y%m%d-%H-%M')
          cat <<EOF > jobs/patch.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: ansible-setup-job
  namespace: flux-system
  labels:
    build-id: "$TIMESTAMP"
EOF

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs/patch.yaml
          git commit -m "Update patch.yaml with build-id $TIMESTAMP" || echo "No changes to commit"
          git push origin main
