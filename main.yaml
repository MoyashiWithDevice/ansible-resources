- name: Setup Apache on Ubuntu
  hosts: test-server
  become: yes  # root権限で実行
  gather_facts: yes

  tasks:
    - name: Ensure Apache is installed
      apt:
        name: apache2
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Ensure Apache is started and enabled
      service:
        name: apache2
        state: started
        enabled: yes
      when: ansible_os_family == "Debian"

    - name: Create a simple index.html
      copy:
        content: |
          <html>
          <body>
          <h1>Managed by Ansible & Terraform</h1>
          <p>Hostname: {{ ansible_hostname }}</p>
          <p>IP Address: {{ ansible_default_ipv4.address }}</p>
          </body>
          </html>
        dest: /var/www/html/index.html
        mode: '0644'