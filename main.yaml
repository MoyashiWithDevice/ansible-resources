- hosts: [kubernetes, worker-rhel, worker-ubuntu, nfs-server]
  become: true

  vars:
    nfs_package:
      Debian: "nfs-common"
      RedHat: "nfs-utils"

  tasks:
    - name: ユーザ作成
      ansible.builtin.user:
        name: bababa
        groups: "{{ 'sudo' if ansible_os_family == 'Debian' else 'wheel' }}"
        append: yes
        shell: /bin/bash
        password: $6$tqBnuHL.b9TPOj0C$eFwcCYcunQKaJNQ3vyZQAF0GwXGjVePpLl4UNft.7DDBFa3vGMEBGg45P30cdXz6buBQA/25u1DT24ByDcHYv/
        state: present

    - name: DNSサーバ設定 (RHEL系)
      when: ansible_os_family == "RedHat"
      block:
        - name: 接続名取得
          command: nmcli -t -f NAME connection show --active
          register: active_connection
          changed_when: false

        - name: DNSサーバ設定
          command: >
            nmcli connection modify "{{ active_connection.stdout }}"
            ipv4.dns "172.31.0.220"
            ipv4.ignore-auto-dns yes
          notify: restart networkmanager

    - name: DNSサーバ設定 (Ubuntu)
      when: ansible_distribution == "Ubuntu"
      block:
        - name: netplan DNS設定
          copy:
            dest: /etc/netplan/99-custom-dns.yaml
            content: |
              network:
                version: 2
                ethernets:
                  {{ ansible_default_ipv4.interface }}:
                    dhcp4: true
                    nameservers:
                      addresses:
                        - 172.31.0.220

        - name: netplan apply
          command: netplan apply
    
    # NFSクライアントをインストール && 起動する 
    - name: NFSクライアントパッケージのインストール
      package:
        name: "{{ nfs_package[ansible_os_family] }}"
        state: present

    - name: 有効化 && スタート
      service:
        name: rpcbind
        state: started
        enabled: yes

    - name: Redhat系で有効化 && スタート
      service:
        name: nfs-utils
        state: started
        enabled: yes
      when: ansible_os_family == "RedHat"


  handlers:
    - name: networkmanagerを再起動して設定を反映
      service:
        name: NetworkManager
        state: restarted