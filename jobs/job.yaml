apiVersion: batch/v1
kind: Job
metadata:
  name: ansible-setup-job
  namespace: flux-system
  labels:
    build-id: "20260125-01-01"
spec:
  template:
    spec:
      serviceAccountName: ansible-sa
      # 1. 起動時に最新の Playbook を Git から持ってくる
      initContainers:
      - name: git-sync
        image: alpine/git
        command: ["git", "clone", "https://github.com/MoyashiWithDevice/ansible-resources.git", "/ansible"]
        volumeMounts:
        - name: playbook-storage
          mountPath: /ansible
      
      containers:
      - name: ansible
        image: bababa2547/ansible-ssh:latest
        env:
        - name: ANSIBLE_HOST_KEY_CHECKING
          value: "False" # 初回接続エラーを防ぐ
        volumeMounts:
        - name: ssh-dir
          mountPath: "/home/ansible/.ssh"
        - name: ssh-key
          mountPath: "/home/ansible/.ssh/private_key"
          subPath: "private_key"
          readOnly: true
        - name: playbook-storage
          mountPath: "/ansible"
        workingDir: "/ansible"
        #command: ["ansible-playbook", "-i", "inventory.ini", "main.yaml", "--private-key", "/root/.ssh/private_key"]
        command: ["sh", "-c", "sleep 3600"]

      volumes:
      - name: ssh-dir
        emptyDir: {}
      - name: ssh-key
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: "ansible-vault-spc"
      - name: playbook-storage
        emptyDir: {} # initContainer から container へ受け渡す一時領域
      restartPolicy: Never