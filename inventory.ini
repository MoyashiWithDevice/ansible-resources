[kube-nodes]
kube-ctrl ansible_host=172.31.0.9
kube-worker-rhel ansible_host=172.32.0.5
kube-worker-ubuntu ansible_host=172.32.0.6
nfs-server ansible_host=172.31.0.11
truenas ansible_host=172.31.0.5
test-server ansible_host=172.31.0.31

[all:vars]
ansible_user=bababa

# コンテナ環境で Python が見つからないエラーを防ぐ
ansible_python_interpreter=/usr/bin/python3
# SSH接続時の指紋(Fingerprint)確認をスキップする
ansible_ssh_common_args='-o StrictHostKeyChecking=no'